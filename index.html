<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      /* Write your CSS Code here */

      .flag {
        width: 900px;
        height: 600px;
        position: relative;
        background-color: #ce1126;
      }
      .flag2 {
        position: absolute;
        background-color: #002868;
        top: 150px;
        width: 100%;
        height: 300px;
      }
      /* Alternatively you could use the child selector '.flag > div '*/
      /* Height being 300 means the  coloured object takes up 50% of the document. positioning it 150px from the top ensures that it is also 150 from the bottom (150+300=450) and aligned centrally  */
      .ol {
        background-color: white;
        position: absolute;

        height: 200px;
        width: 200px;
        border-radius: 50%;
        top: 50px;
        left: 350px;
      }
      /* Alternatively you could use the ccombination selector of child selector + descendant selector) .flag > div > div  '*/
      p {
        font-size: 5rem;
        color: white;
        text-align: center;
        padding: 0;
        margin: 0;
      }
      .ol {
        color: black;
      }
    </style>
  </head>

  <body>
    <div class="flag">
      <p>The Flag</p>
      <div>
        <div class="flag2">
          <p class="ol">of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
